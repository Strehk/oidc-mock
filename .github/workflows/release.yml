name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish to npm unless this version is already there
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "oidc-mock@$version" version >/dev/null 2>&1; then
            echo "oidc-mock@$version is already on npm, skipping publish"
          else
            npm publish --provenance --ignore-scripts
          fi
      - run: npm pack --ignore-scripts
      - name: Create release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" oidc-mock-*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "npm: https://www.npmjs.com/package/oidc-mock/v/${GITHUB_REF_NAME#v}"
